services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        image: aprende-mais-app
        container_name: aprende-mais-app
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            APP_URL: http://localhost:8000
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: aprendemais
            DB_USERNAME: aprendemais
            DB_PASSWORD: secret
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "test -f /tmp/app-ready"]
            interval: 5s
            timeout: 3s
            retries: 90
            start_period: 30s
        networks:
            - aprende-mais

    nginx:
        image: nginx:stable-alpine
        container_name: aprende-mais-nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            app:
                condition: service_healthy
        networks:
            - aprende-mais

    node:
        build:
            context: .
            dockerfile: docker/node/Dockerfile
        image: aprende-mais-node
        container_name: aprende-mais-node
        working_dir: /var/www/html
        command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
        ports:
            - "5173:5173"
        volumes:
            - .:/var/www/html
            - aprende-mais-node-modules:/var/www/html/node_modules
        environment:
            VITE_APP_NAME: "${APP_NAME:-Laravel}"
        depends_on:
            app:
                condition: service_healthy
        networks:
            - aprende-mais

    db:
        image: mysql:8.4
        container_name: aprende-mais-db
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: aprendemais
            MYSQL_USER: aprendemais
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: secret
        ports:
            - "3307:3306"
        volumes:
            - aprende-mais-db-data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
            interval: 5s
            timeout: 5s
            retries: 10
        networks:
            - aprende-mais

networks:
    aprende-mais:
        driver: bridge

volumes:
    aprende-mais-db-data:
        driver: local
    aprende-mais-node-modules:
        driver: local
